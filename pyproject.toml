[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meeting-interpreter"
version = "0.2.20"
description = "NMT: local meeting transcription and bilingual subtitles for macOS."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "elizzzzzz and contributors"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/elizzzzzz/Neo-Meeting-Translater"
Repository = "https://github.com/elizzzzzz/Neo-Meeting-Translater"
Issues = "https://github.com/elizzzzzz/Neo-Meeting-Translater/issues"
Releases = "https://github.com/elizzzzzz/Neo-Meeting-Translater/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]
apple = [
  "mlx-whisper>=0.4,<1",
  "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=12,<13; sys_platform == 'darwin'",
]
translation = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
]
diarization = [
  "pyannote.audio>=3.3,<5",
]
installer = [
  "pyinstaller>=6.10,<7",
]
audio = [
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
]
speaker = [
  "sherpa-onnx==2.0.1",
]

[project.scripts]
meeting-interpreter = "meeting_interpreter.cli:main"
meeting-interpreter-desktop = "meeting_interpreter.desktop:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
