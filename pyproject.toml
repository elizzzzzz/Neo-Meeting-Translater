[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meeting-interpreter"
version = "0.1.0"
description = "Local multilingual meeting transcription and translation for Chinese, Japanese and English."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]
audio = [
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
]

[project.scripts]
meeting-interpreter = "meeting_interpreter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
